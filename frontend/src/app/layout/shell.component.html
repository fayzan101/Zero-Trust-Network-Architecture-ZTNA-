<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">ZT</div>
      <div>
        <div class="brand-name">ZTNA Console</div>
        <div class="brand-sub">Zero Trust Simulator</div>
      </div>
    </div>

    <nav class="nav">
      @for (item of nav; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="user-pill">
        <span class="dot" [class.on]="ws.connected()"></span>
        {{ auth.username() || 'User' }}
      </div>
      <button class="btn btn-ghost logout-btn" (click)="logout()">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <router-outlet />
  </main>
</div>
