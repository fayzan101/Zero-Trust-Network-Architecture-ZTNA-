spring:
  datasource:
    url: jdbc:h2:mem:zerotrust_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: never
jwt:
  secret: test_jwt_secret_key_must_be_at_least_32_chars
cors:
  allowed-origins: http://localhost:5173
