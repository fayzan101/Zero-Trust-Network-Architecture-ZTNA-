<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZTNA Live Security Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 1rem 1.5rem; background: #1e293b; border-bottom: 1px solid #334155; }
    h1 { margin: 0; font-size: 1.25rem; }
    .status { font-size: 0.85rem; color: #94a3b8; margin-top: 0.25rem; }
    .status.connected { color: #4ade80; }
    #events { padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; max-height: calc(100vh - 80px); overflow-y: auto; }
    .event { padding: 0.75rem 1rem; border-radius: 8px; background: #1e293b; border-left: 4px solid #64748b; }
    .event.INFO { border-left-color: #38bdf8; }
    .event.WARN { border-left-color: #fbbf24; }
    .event.CRITICAL { border-left-color: #f87171; }
    .event-type { font-weight: 600; font-size: 0.9rem; }
    .event-meta { font-size: 0.8rem; color: #94a3b8; margin-top: 0.25rem; }
    .event-details { font-size: 0.85rem; margin-top: 0.35rem; }
  </style>
</head>
<body>
  <header>
    <h1>ZTNA Live Security Dashboard</h1>
    <div id="status" class="status">Connecting…</div>
  </header>
  <div id="events"></div>
  <script>
    const statusEl = document.getElementById('status');
    const eventsEl = document.getElementById('events');
    const wsUrl = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws/security';
    const ws = new WebSocket(wsUrl);

    ws.onopen = () => { statusEl.textContent = 'Connected to ' + wsUrl; statusEl.classList.add('connected'); };
    ws.onclose = () => { statusEl.textContent = 'Disconnected'; statusEl.classList.remove('connected'); };
    ws.onerror = () => { statusEl.textContent = 'Connection error'; };

    ws.onmessage = (msg) => {
      const data = JSON.parse(msg.data);
      const div = document.createElement('div');
      div.className = 'event ' + (data.severity || 'INFO');
      const time = data.timestamp ? new Date(data.timestamp).toLocaleTimeString() : new Date().toLocaleTimeString();
      div.innerHTML = '<div class="event-type">' + (data.eventType || data.type || 'EVENT') + '</div>'
        + '<div class="event-meta">' + time
        + (data.username ? ' · ' + data.username : '')
        + (data.ipAddress ? ' · ' + data.ipAddress : '')
        + (data.severity ? ' · ' + data.severity : '') + '</div>'
        + (data.details ? '<div class="event-details">' + data.details + '</div>' : '');
      eventsEl.prepend(div);
      while (eventsEl.children.length > 100) eventsEl.removeChild(eventsEl.lastChild);
    };
  </script>
</body>
</html>
